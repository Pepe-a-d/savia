<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Savia</title>
    <meta name="description" content="Un incremental de árboles en pixel art: guía sus raíces, hazlos crecer y atrapa sus frutos temporada tras temporada." />
    <meta name="theme-color" content="#140F1C" />
    <link rel="icon" href="favicon.svg" type="image/svg+xml" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Jersey+15&display=swap" rel="stylesheet" />
  </head>
  <body>
    <div id="app">
      <section id="screen-tree" class="screen">
        <header class="topbar">
          <div class="brand">SAVIA <small id="gen"></small></div>
          <div class="res-bar" id="tree-res"></div>
          <button type="button" class="px-icon" id="gear" aria-label="Ajustes"></button>
        </header>
        <div id="tree" class="tree"></div>
        <footer class="tree-foot">
          <p class="last" id="last"></p>
          <div class="zone-pick" id="zone-pick" role="group" aria-label="Dónde pasar la temporada" hidden></div>
          <button type="button" class="px-btn big" id="start"></button>
          <button type="button" class="px-icon" id="center" aria-label="Centrar las mejoras"></button>
        </footer>
      </section>

      <section id="screen-run" class="screen" hidden>
        <canvas id="run"></canvas>
        <header class="run-hud">
          <div class="run-top">
            <span class="run-season" id="run-season"></span>
            <div class="res-bar" id="run-res"></div>
            <span class="run-growth" id="run-growth" title="Crecimiento del árbol"></span>
          </div>
          <div class="sprouts" id="sprouts"><span>Brotes</span><div class="sbar"><i id="sprout-fill"></i></div></div>
          <div class="catch" id="catch" hidden></div>
        </header>
        <div class="depth-bar" id="depth-bar" hidden>
          <div class="db-track" id="db-track"><i class="db-fill" id="db-fill"></i><b class="db-rec" id="db-rec" hidden></b></div>
          <div class="db-label" id="db-label"></div>
        </div>
        <p class="run-hint" id="run-hint" hidden></p>
        <div class="summary px-panel" id="summary" hidden></div>
      </section>
    </div>
    <div id="toasts" class="toasts" aria-live="polite"></div>
    <div id="modal-root"></div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
